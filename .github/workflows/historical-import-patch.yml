name: Historical Import Patch Gate

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Wire historical import panel
        run: python .github/scripts/historical_import_patch.py
      - name: Format changed files
        run: >-
          npx prettier --write
          src/lib/experimentHistoricalCsv.ts
          src/lib/experimentHistory.ts
          src/components/briefflow/ExperimentHistoricalImport.tsx
          src/components/briefflow/ExperimentEvidencePanel.tsx
          tests/experiment-history-import.test.mjs
          supabase/migrations/20261023180547_add_historical_experiment_import.sql
      - name: Validate quality gate
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Remove temporary patch files
        run: |
          rm -f .github/scripts/historical_import_patch.py
          rm -f .github/workflows/historical-import-patch.yml
      - name: Commit validated feature
        run: |
          git config user.name "Pedro"
          git config user.email "65820000+Pedro-Vieira1507@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: import historical experiment results"
          git push origin HEAD:production/creative-studio
