): string[] {
  const normalized = instruction.toLocaleLowerCase("pt-BR");
  const targets = new Set<string>();
  const matches = (pattern: RegExp) => pattern.test(normalized);

  if (matches(/headline|t[ií]tulo|assunto/)) targets.add("title");
  if (matches(/subt[ií]tulo|subheadline|apoio/)) targets.add("subtitle");
  if (matches(/preheader|pr[eé]-header|pr[eé]via/)) targets.add("preheader");
