name: Creative workspace phase 2 patch

on:
  push:
    branches: [production/creative-studio]
    paths:
      - .github/workflows/phase2-creative-workspace-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
          fetch-depth: 0
      - name: Apply workspace evolution patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"expected block not found in {path}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          def write(path: str, content: str):
              p = Path(path)
              p.parent.mkdir(parents=True, exist_ok=True)
              p.write_text(content)

          # ---------- Supabase client helpers ----------
          replace(
              "src/lib/supabase.ts",
              "export interface SavedLibraryAsset {\n",
              "export type LibraryAssetStatus = \\\"draft\\\" | \\\"review\\\" | \\\"approved\\\";\n\nexport interface SavedLibraryAsset {\n",
          )
          replace(
              "src/lib/supabase.ts",
              "  status: string;\n",
              "  status: LibraryAssetStatus;\n",
          )
          replace(
              "src/lib/supabase.ts",
              "export interface SavedAssetsPage {\n  items: SavedLibraryAsset[];\n  nextCursor: SavedAssetsCursor | null;\n}\n",
              """export interface SavedAssetsPage {
