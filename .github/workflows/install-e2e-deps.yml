name: Install E2E Dependencies

on:
  push:
    branches: [production/creative-studio]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - name: Install pinned E2E dependencies
        run: npm install --save-dev --save-exact @playwright/test@1.64.1 @axe-core/playwright@4.14.0
      - name: Add E2E script
        run: npm pkg set 'scripts.test:e2e=playwright test'
      - name: Format manifests
        run: npx prettier --write package.json package-lock.json
      - name: Security threshold
        run: npm audit --audit-level=high
      - name: Commit dependency update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "test: install Playwright and axe for E2E QA"
          git push origin HEAD:production/creative-studio
