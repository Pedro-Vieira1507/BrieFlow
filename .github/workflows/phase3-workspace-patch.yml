name: Phase 3 workspace patch

on:
  push:
    branches: [production/creative-studio]
    paths:
      - .github/workflows/phase3-workspace-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Apply phase 3 patch
        run: python3 .github/scripts/phase3_patch.py
      - name: Format and validate
        run: |
          npx prettier --write src/lib/supabase.ts src/lib/creativeQuality.ts src/components/briefflow/LibraryModal.tsx src/components/briefflow/builder/EditorialReview.tsx tests/campaign-history.test.mjs
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
      - name: Commit phase 3
        run: |
          git config user.name "Pedro"
          git config user.email "65820000+Pedro-Vieira1507@users.noreply.github.com"
          git add src tests
          git commit -m "feat: add campaign history AB variants and quality score"
          git push origin HEAD:production/creative-studio

# trigger phase 3 patch
