name: Production E2E

on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: production-e2e-brieflow
  cancel-in-progress: true

jobs:
  production-smoke:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'production/creative-studio')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      E2E_BASE_URL: https://brieflow-ai.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Exercise the real production deployment
        run: >-
          npx playwright test
          e2e/production-smoke.spec.ts
          e2e/production-accessibility.spec.ts
          --project=chromium
          --project=mobile-chromium
      - name: Upload production Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
