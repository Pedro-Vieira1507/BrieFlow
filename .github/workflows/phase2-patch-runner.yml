name: Phase 2 patch runner

on:
  push:
    branches: [production/creative-studio]
    paths:
      - .github/workflows/phase2-patch-runner.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
          fetch-depth: 0
      - name: Apply prepared phase 2 patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          source = Path('.github/workflows/phase2-creative-workspace-patch.yml').read_text()
          start_marker = '          from pathlib import Path\n'
          end_marker = '\n          PY\n\n          git config user.name'
          start = source.index(start_marker)
          end = source.index(end_marker, start)
          block = source[start:end]

          normalized_lines = []
          in_triple_string = False
          for line in block.splitlines():
              if in_triple_string:
                  current = line
              else:
                  current = line[10:] if line.startswith('          ') else line
              normalized_lines.append(current)
              if current.count("'''") % 2 == 1:
                  in_triple_string = not in_triple_string

          Path('/tmp/phase2_patch.py').write_text(
              '\n'.join(normalized_lines) + '\n'
          )
          PY
          python3 /tmp/phase2_patch.py

          git config user.name "Pedro"
          git config user.email "65820000+Pedro-Vieira1507@users.noreply.github.com"
          git add src supabase/migrations tests
          git commit -m "feat: add brand kits and campaign workflow"
          git push origin HEAD:production/creative-studio
