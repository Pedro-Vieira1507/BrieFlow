name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, production/creative-studio]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Fix historical date regex
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/lib/experimentHistoricalCsv.ts")
          lines = path.read_text().splitlines()
          matches = 0
          for index, line in enumerate(lines):
              if "const br = raw.match" in line:
                  lines[index] = r'  const br = raw.match(/^(\d{1,2})[/.-](\d{1,2})[/.-](\d{4})$/);'
                  matches += 1
          if matches != 1:
              raise SystemExit(f"expected one BR date regex, found {matches}")
          path.write_text("\n".join(lines) + "\n")
          PY
      - name: Format historical import files
        run: npx prettier --write src/components/briefflow/ExperimentHistoricalImport.tsx src/lib/experimentHistoricalCsv.ts src/lib/experimentHistory.ts tests/experiment-history-import.test.mjs
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Commit validated source formatting
        run: |
          git config user.name "Pedro"
          git config user.email "65820000+Pedro-Vieira1507@users.noreply.github.com"
          git add src/components/briefflow/ExperimentHistoricalImport.tsx src/lib/experimentHistoricalCsv.ts src/lib/experimentHistory.ts tests/experiment-history-import.test.mjs
          git diff --cached --quiet && exit 0
          git commit -m "chore: finish historical import formatting"
          git push origin HEAD:production/creative-studio

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser E2E and accessibility suite
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: /tmp
        run: >-
          deno check --no-config --node-modules-dir=none
          "$GITHUB_WORKSPACE"/supabase/functions/{ai-proxy,image-render,product-segment,scrape-proxy,image-search,billing,stripe-webhook,media-render,multimodal}/index.ts
