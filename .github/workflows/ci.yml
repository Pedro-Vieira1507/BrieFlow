name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, production/creative-studio]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Finalize patched dependency and formatting
        if: github.event_name == 'push' && github.ref == 'refs/heads/production/creative-studio'
        run: |
          npm install zod@4.6.7 --package-lock-only --ignore-scripts --save-exact
          npx prettier src/lib/experimentStatistics.ts --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src/lib/experimentStatistics.ts
          if ! git diff --cached --quiet; then
            git commit -m "security: upgrade zod and finalize experiment evidence"
            git push origin HEAD:production/creative-studio
          fi
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  e2e:
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Run browser E2E and accessibility suite
        run: npm run test:e2e
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 7

  edge-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check Edge Functions
        working-directory: /tmp
        run: >-
          deno check --no-config --node-modules-dir=none
          "$GITHUB_WORKSPACE"/supabase/functions/{ai-proxy,image-render,product-segment,scrape-proxy,image-search,billing,stripe-webhook,media-render,multimodal}/index.ts
