name: Phase 2 format fix

on:
  push:
    branches: [production/creative-studio]
    paths:
      - .github/workflows/phase2-format-fix.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: production/creative-studio
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Fix generated syntax and format phase 2 files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('src/lib/supabase.ts')
          text = path.read_text()
          old = 'export type LibraryAssetStatus = \\"draft\\" | \\"review\\" | \\"approved\\";'
          new = 'export type LibraryAssetStatus = "draft" | "review" | "approved";'
          if old not in text:
              raise SystemExit('escaped LibraryAssetStatus declaration not found')
          path.write_text(text.replace(old, new, 1))
          PY
          npx prettier --write \
            src/components/briefflow/BrandKitPanel.tsx \
            src/components/briefflow/builder/CampaignTabs.tsx \
            src/components/briefflow/LibraryModal.tsx \
            src/components/briefflow/PageBuilder.tsx \
            src/components/briefflow/ProfileSettingsModal.tsx \
            src/components/briefflow/WorkspaceShell.tsx \
            src/hooks/useBriefflowAgent.ts \
            src/lib/marketingPrompts.ts \
            src/lib/supabase.ts \
            src/types/brief.ts \
            src/types/builder.ts \
            tests/workspace-evolution.test.mjs
          git diff --check
      - name: Commit formatting
        shell: bash
        run: |
          git config user.name "Pedro"
          git config user.email "65820000+Pedro-Vieira1507@users.noreply.github.com"
          git add src tests
          git commit -m "fix: format phase 2 workspace changes"
          git push origin HEAD:production/creative-studio
