              comparison_button,
          )

          history_section_anchor = '''                    {historyOpen ? (
                      <section'''
          comparison_section = '''                    {comparisonOpen && selectedItem.experiment_group_id ? (
                      <ExperimentComparison
                        experimentGroupId={selectedItem.experiment_group_id}
                      />
                    ) : null}

          ''' + history_section_anchor
          replace_once(
