              comparison_section,
          )

          replace_once(
              "tests/campaign-history.test.mjs",
              'supabase/migrations/20261023121500_add_asset_versions_and_ab_variants.sql',
              'supabase/migrations/20261023121753_add_asset_versions_and_ab_variants.sql',
          )
          PY
