name: Security Refresh Creative

on:
  push:
    branches: [production/creative-studio]

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Apply non-breaking security fixes
        run: npm audit fix --ignore-scripts
      - name: Verify security threshold
        run: npm audit --audit-level=high
      - name: Validate updated dependency tree
        run: |
          npm run typecheck
          npm test
          npm run build
      - name: Format dependency manifests
        run: npx prettier --write package.json package-lock.json
      - name: Commit security refresh
        run: |
          if git diff --quiet; then
            echo "No dependency changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "fix: apply dependency security updates"
          git push origin HEAD:production/creative-studio
