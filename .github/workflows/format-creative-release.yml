name: Format Creative Release

on:
  push:
    branches: [production/creative-studio]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Use npm 11
        run: npm install --global npm@11
      - run: npm ci --ignore-scripts
      - name: Format release files
        run: >-
          npx prettier --write
          src/components/briefflow/OnboardingCoach.tsx
          src/components/briefflow/chat/ChatInput.tsx
          e2e/production-accessibility.spec.ts
          e2e/support/mockBackend.ts
          tests/creative-evolution.test.mjs
          .github/workflows/production-e2e.yml
      - name: Verify formatted release
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "No formatting changes required"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/components/briefflow/OnboardingCoach.tsx \
            src/components/briefflow/chat/ChatInput.tsx \
            e2e/production-accessibility.spec.ts \
            e2e/support/mockBackend.ts \
            tests/creative-evolution.test.mjs \
            .github/workflows/production-e2e.yml
          git commit -m "style: format creative release"
          git push origin HEAD:production/creative-studio
